services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: rescuechain-jenkins
    restart: unless-stopped

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home

    networks:
      - jenkins

  rescuechain-agent:
    build:
      context: ./agents
      dockerfile: Dockerfile

    container_name: rescuechain-agent
    restart: unless-stopped

    environment:
      JENKINS_URL: http://jenkins:8080
      JENKINS_AGENT_NAME: rescuechain-agent
      JENKINS_SECRET: ${JENKINS_AGENT_SECRET}

    volumes:
      - ./agents/rescuechain-agent:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - jenkins

    depends_on:
      - jenkins

volumes:
  jenkins_home:

networks:
  jenkins: