services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: rescuechain-jenkins
    restart: unless-stopped

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home

    networks:
      - jenkins

  rescuechain-agent:
    image: jenkins/inbound-agent:latest
    container_name: rescuechain-agent
    restart: unless-stopped

    environment:
      JENKINS_URL: http://jenkins:8080
      JENKINS_AGENT_NAME: rescuechain-agent
      JENKINS_SECRET: 26643c92aaf1daf9e6a1666c822a1a87aecef98729957e448d54d28d1b137791

    volumes:
      - ./agents/rescuechain-agent:/home/jenkins/agent

    networks:
      - jenkins

    depends_on:
      - jenkins

networks:
  jenkins:

volumes:
  jenkins_home: